name: Build OpenWrt Manager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          # Backup file pubspec.yaml dan folder lib kita
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak

          # Generate kerangka project Android otomatis
          flutter create --org id.openwrt.wrtbox --project-name wrtbox --platforms=android .

          # Kembalikan file kode aplikasi kita
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib
          mv lib_bak lib

      - name: Inject Android Manifest Permissions (Internet & Cleartext HTTP)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/><application android:usesCleartextTraffic="true"/g' "$MANIFEST"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WrtBox-OpenWrt-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
