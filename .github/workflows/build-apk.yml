name: Build OpenWrt Manager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          # Backup file pubspec.yaml dan folder lib kita
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak

          # Generate kerangka project Android otomatis
          flutter create --org id.openwrt.wrtbox --project-name wrtbox --platforms=android .

          # Kembalikan file kode aplikasi kita
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib test
          mv lib_bak lib

      - name: Upgrade Android Gradle Plugin (AGP 8.5.2), SDK 35 & Manifest
        run: |
          # 1. Tambahkan izin Internet & Cleartext HTTP di AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/><application android:usesCleartextTraffic="true"/g' "$MANIFEST"

          # 2. Naikkan Gradle Wrapper ke 8.7 (agar mendukung AGP 8.5.2)
          sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

          # 3. Naikkan AGP dari 8.1.0 ke 8.5.2 & Kotlin ke 1.9.24 di settings.gradle
          sed -i 's/id "com.android.application" version "[0-9.]*"/id "com.android.application" version "8.5.2"/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle

          # 4. Set compileSdk = 35 dan minSdk = 21 di android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WrtBox-OpenWrt-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
